# Konfigurasi node HONEST (penambang jujur yang menambang rantai publik).
# Baris ini memaksa node selalu berjalan di regtest (jaringan privat lokal),
# sehingga node tidak pernah tersambung ke mainnet/testnet publik.
regtest=1

[regtest]
# Port P2P (antar-node) dan port RPC (perintah dari Python) khusus node ini.
# Tiap node harus beda port karena ketiganya berjalan di satu laptop.
port=18602
rpcport=18502

# Hanya dengarkan alamat lokal (127.0.0.1): tidak ada komputer lain yang bisa masuk.
bind=127.0.0.1
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# Nama pengguna & kata sandi RPC. Aman karena hanya bisa diakses dari laptop ini.
rpcuser=jkkd
rpcpassword=jkkd

# Matikan Tor dan pencarian peer otomatis: node hanya tersambung ke node yang
# kita sambungkan sendiri lewat skrip.
listenonion=0
dnsseed=0
